[project]
name = "final"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.2.0",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "optuna>=4.2.0",
    "pandas>=2.1.2,<=2.3.3",
    "pdfplumber>=0.11.9",
    "scikit-learn>=1.3.1,<=1.6.1",
    "seaborn>=0.13.2",
    "tabpfn>=8.0.6",
    "xgboost>=3.2.0",
    "shap>=0.51.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.9",
    "pyrefly>=0.1.0",
    "pandas-stubs",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
extraPaths = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]

[tool.pyrefly]
search-path = ["."]
min-severity = "warn"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pypandoc-binary>=1.17",
]
